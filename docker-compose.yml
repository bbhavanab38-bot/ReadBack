version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEMO_MODE=true
      - DATABASE_URL=sqlite:///./readback.db
      - CONFIDENCE_THRESHOLD=0.80
      - ENABLE_MULTILINGUAL=true
    volumes:
      - backend_data:/app/uploads
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend_data:
